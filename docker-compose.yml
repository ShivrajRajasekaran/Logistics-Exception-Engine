# One-command evaluation path (no .env required):
#   docker compose up --build
#   curl http://localhost:8000/health
#
# OPENAI_API_KEY is optional and read from the shell if exported; without it
# /reason returns a labelled deterministic summary instead of LLM prose.
# Weights and sample images are baked into the image, so `docker run` alone
# works. These read-only bind mounts shadow the same paths during local
# development, so a reviewer can swap a checkpoint without a rebuild.

services:
  exception-engine:
    build: .
    image: logistics-exception-engine:1.0.0
    container_name: exception-engine
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WEIGHTS_PATH: /app/weights/best.pt
      CONFIDENCE_THRESHOLD: "0.25"
      GUARDRAIL_THRESHOLD: "0.65"
      LOG_LEVEL: INFO
    volumes:
      - ./weights:/app/weights:ro
      - ./sample_images:/app/sample_images:ro
      # The adjudication log is append-only and lives in the container
      # filesystem, so `up --build` would otherwise discard every recorded
      # verdict. Writable on purpose; the two mounts above are read-only.
      - ./logs:/app/logs
    restart: unless-stopped
